[project]
name = "susc-rag"
version = "1.0.0"
description = "SUSC Knowledge Assistant — a retrieval-augmented QA system over SUSC documents."
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data", "index", "local_index", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
# Allow broad excepts where we deliberately degrade gracefully (documented inline).
ignore = ["B904"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
